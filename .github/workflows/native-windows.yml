name: Windows NativeAOT

on:
  pull_request:
    branches: [main]
    paths:
      - "DotNetMcp/**"
      - "DotNetMcp.SdkHelper/**"
      - "DotNetMcp.Tests/**"
      - "scripts/**"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "DotNetMcp.slnx"
      - ".config/dotnet-tools.json"
      - ".github/actions/setup-dotnet/**"
      - ".github/workflows/native-windows.yml"
      - "global.json"
      - "NuGet.Config"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk_policy:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.resolve.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Resolve SDK lanes
        id: resolve
        shell: pwsh
        run: ./scripts/resolve-dotnet-sdk.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

  native:
    needs: sdk_policy
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}
      - name: Publish actual NativeAOT server and SDK helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\native-results -Force | Out-Null
          ./scripts/publish-native.ps1 2>&1 | Tee-Object artifacts\native-results\publish.log
      - name: Validate relocated Windows native distribution
        shell: pwsh
        run: ./scripts/test-native.ps1 2>&1 | Tee-Object artifacts\native-results\validation.log
      - name: Preserve native distribution and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7
        with:
          name: native-windows-${{ matrix.sdk }}
          path: |
            artifacts/native/win-x64/
            artifacts/native-results/
          if-no-files-found: error
