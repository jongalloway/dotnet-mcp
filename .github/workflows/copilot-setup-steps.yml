name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-dotnet/**
      - scripts/resolve-dotnet-sdk.ps1
      - global.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-dotnet/**
      - scripts/resolve-dotnet-sdk.ps1
      - global.json

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore dependencies
        run: dotnet restore DotNetMcp/DotNetMcp.csproj

      - name: Build project
        run: dotnet build DotNetMcp/DotNetMcp.csproj --no-restore

      - name: Verify dotnet CLI is available
        run: dotnet --version
