name: Build and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      runScenarioTests:
        description: "Run MCP scenario (integration) tests"
        required: false
        default: "true"
      runFullValidation:
        description: "Run full tests with coverage and performance smoke"
        required: false
        default: "true"

# Cancel in-progress runs for the same branch to save CI resources
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sdk_policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.resolve.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Test SDK selection policy
        shell: pwsh
        run: ./scripts/test-sdk-selection.ps1
      - name: Resolve available SDK lanes
        id: resolve
        shell: pwsh
        run: ./scripts/resolve-dotnet-sdk.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

  detect_changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      scenario_related: ${{ steps.changes.outputs.scenario_related }}

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base" "$head")"
          files="$(git diff --name-only "$merge_base" "$head")"

          if echo "$files" | grep -qE '^(DotNetMcp.Tests/(Scenarios|ReleaseScenarios)/|DotNetMcp/Prompts/|DotNetMcp/Resources/|global.json$|\.github/(actions/setup-dotnet/|workflows/)|scripts/(resolve-dotnet-sdk|test-sdk-selection|test-tool-compatibility|run-release-gate-tests)\.ps1$)'; then
            echo "scenario_related=true" >> "$GITHUB_OUTPUT"
          else
            echo "scenario_related=false" >> "$GITHUB_OUTPUT"
          fi

  pr_conformance:
    needs: sdk_policy
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}

      - name: Restore dependencies
        run: dotnet restore DotNetMcp.slnx

      - name: Build
        run: dotnet build DotNetMcp.slnx --no-restore --configuration Release

      - name: Validate server.json
        run: pwsh -File scripts/validate-server-json.ps1

      - name: Run MCP Conformance and Project Analysis Tests
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-class "*McpConformanceTests" --filter-class "*ProjectAnalysisHelperTests"

  pr_scenario:
    # Also exercise scenarios when SDK selection or validation infrastructure changes.
    needs: [detect_changes, sdk_policy]
    if: ${{ github.event_name == 'pull_request' && needs.detect_changes.outputs.scenario_related == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}
    permissions:
      contents: read

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}

      - name: Restore dependencies
        run: dotnet restore DotNetMcp.slnx

      - name: Build
        run: dotnet build DotNetMcp.slnx --no-restore --configuration Release

      - name: Run MCP Scenario Tests
        env:
          DOTNET_MCP_SCENARIO_TESTS: "1"
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-namespace "*DotNetMcp.Tests.Scenarios*"

  manual_quick_checks:
    needs: sdk_policy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runFullValidation != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}

      - name: Restore dependencies
        run: dotnet restore DotNetMcp.slnx

      - name: Build
        run: dotnet build DotNetMcp.slnx --no-restore --configuration Release

      - name: Validate server.json
        run: pwsh -File scripts/validate-server-json.ps1

      - name: Run MCP Conformance Tests
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-class "*McpConformanceTests"

      - name: Run MCP Scenario Tests
        if: ${{ inputs.runScenarioTests == 'true' }}
        env:
          DOTNET_MCP_SCENARIO_TESTS: "1"
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-namespace "*DotNetMcp.Tests.Scenarios*"

  full_validation:
    needs: sdk_policy
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runFullValidation == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        id: setup_dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}

      - name: Display .NET info
        id: dotnet_info
        run: dotnet --info

      - name: Restore dependencies
        id: restore
        run: dotnet restore DotNetMcp.slnx

      - name: Build
        id: build
        run: dotnet build DotNetMcp.slnx --no-restore --configuration Release

      - name: Validate server.json
        id: validate_server_json
        run: pwsh -File scripts/validate-server-json.ps1

      - name: Run MCP Conformance Tests
        id: conformance_tests
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-class "*McpConformanceTests"

      - name: Run MCP Scenario Tests
        id: scenario_tests
        # For push runs, always run. For manual full runs, allow skipping with input.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runScenarioTests == 'true') }}
        env:
          DOTNET_MCP_SCENARIO_TESTS: "1"
        run: dotnet test --solution DotNetMcp.slnx --no-build --configuration Release --verbosity normal -- --filter-namespace "*DotNetMcp.Tests.Scenarios*"

      - name: Test
        id: test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          for tfm in net10.0 net11.0; do
            name="$tfm.cobertura.xml"
            if [[ "$tfm" == "net10.0" ]]; then name="coverage.cobertura.xml"; fi
            dotnet test --solution DotNetMcp.slnx --framework "$tfm" --no-build \
              --configuration Release --verbosity normal -- \
              --coverage --coverage-output "$GITHUB_WORKSPACE/coverage/$name" --coverage-output-format cobertura
          done

      - name: Collect coverage artifact
        id: collect_coverage
        shell: bash
        run: |
          set -euo pipefail
          for report in coverage/coverage.cobertura.xml coverage/net11.0.cobertura.xml; do
            if [[ ! -s "$report" ]]; then
              echo "Expected a nonempty Cobertura report: $report" >&2
              exit 1
            fi
          done

      - name: Upload coverage to Codecov
        id: upload_codecov
        # Upload from any full_validation run (push or workflow_dispatch) targeting the main branch.
        if: ${{ github.ref == 'refs/heads/main' && matrix.sdk == 'current' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # pin@v7
        with:
          files: coverage/coverage.cobertura.xml,coverage/net11.0.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        id: upload_coverage_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7
        with:
          name: ${{ matrix.sdk == 'current' && 'coverage-cobertura' || 'coverage-cobertura-rc3' }}
          path: coverage/*.cobertura.xml

      - name: Run Performance Smoke Tests
        id: performance_smoke
        # Performance tests are informational only and should not block CI
        # Results are uploaded as artifacts for review
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "Running performance smoke tests..."
          dotnet test --solution DotNetMcp.slnx \
            --no-build --configuration Release \
            --verbosity detailed \
            -- --filter-namespace "*Performance*" > performance-results.txt 2>&1 || true
          echo "Performance smoke tests completed"
          cat performance-results.txt

      - name: Upload performance results artifact
        id: upload_performance_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7
        with:
          name: ${{ matrix.sdk == 'current' && 'performance-results' || 'performance-results-rc3' }}
          path: performance-results.txt
          if-no-files-found: warn

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## dotnet-mcp CI summary"
            echo ""
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- SDK lane: \`${{ matrix.sdk }}\` (${{ steps.setup_dotnet.outputs.sdk-version }})"
            echo ""
            echo "### Step outcomes"
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Setup .NET | ${{ steps.setup_dotnet.outcome }} |"
            echo "| dotnet --info | ${{ steps.dotnet_info.outcome }} |"
            echo "| Restore | ${{ steps.restore.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Validate server.json | ${{ steps.validate_server_json.outcome }} |"
            echo "| Conformance tests | ${{ steps.conformance_tests.outcome }} |"
            echo "| Scenario tests | ${{ steps.scenario_tests.outcome }} |"
            echo "| Test (+coverage) | ${{ steps.test.outcome }} |"
            echo "| Collect coverage artifact | ${{ steps.collect_coverage.outcome }} |"
            echo "| Upload Codecov | ${{ steps.upload_codecov.outcome }} |"
            echo "| Upload coverage artifact | ${{ steps.upload_coverage_artifact.outcome }} |"
            echo "| Performance smoke | ${{ steps.performance_smoke.outcome }} |"
            echo "| Upload performance artifact | ${{ steps.upload_performance_artifact.outcome }} |"
            echo ""
            echo "### Artifacts"
            echo "- ${{ matrix.sdk == 'current' && 'coverage-cobertura' || 'coverage-cobertura-rc3' }}"
            echo "- ${{ matrix.sdk == 'current' && 'performance-results' || 'performance-results-rc3' }}"
          } >> "${GITHUB_STEP_SUMMARY}"
