name: Release Scenario Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS (ubuntu-latest, windows-latest, or all)"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - all
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read
  actions: read

jobs:
  sdk_policy:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.resolve.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Test SDK selection policy
        shell: pwsh
        run: ./scripts/test-sdk-selection.ps1
      - name: Resolve available SDK lanes
        id: resolve
        shell: pwsh
        run: ./scripts/resolve-dotnet-sdk.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

  packaged-tool:
    uses: ./.github/workflows/tool-compatibility.yml

  release-scenarios:
    needs: sdk_policy
    name: Release scenarios (${{ matrix.os }}, ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
        sdk: ${{ fromJSON(needs.sdk_policy.outputs.lanes) }}

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_MCP_SCENARIO_TESTS: "1"
      DOTNET_MCP_RELEASE_SCENARIO_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup .NET
        id: setup_dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          lane: ${{ matrix.sdk }}

      - name: Display .NET info
        id: dotnet_info
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release-results -Force | Out-Null
          dotnet --info | Tee-Object artifacts/release-results/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore dependencies
        id: restore
        run: dotnet restore DotNetMcp.slnx

      - name: Build
        id: build
        run: dotnet build DotNetMcp.slnx --no-restore --configuration Release

      - name: Validate server.json
        id: validate_server_json
        run: pwsh -File scripts/validate-server-json.ps1

      - name: Run Scenario + Release Scenario Tests
        id: release_scenarios
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/run-release-gate-tests.ps1 -NoRestore -NoBuild -SkipServerJsonValidation 2>&1 |
            Tee-Object artifacts/release-results/scenarios.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7
        with:
          name: release-scenarios-${{ matrix.os }}-${{ matrix.sdk }}
          path: artifacts/release-results/*
          if-no-files-found: warn

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          $summary = @'
          ## dotnet-mcp release scenarios summary

          - OS: `${{ matrix.os }}`
          - SDK lane: `${{ matrix.sdk }}`
          - Build SDK: `${{ steps.setup_dotnet.outputs.sdk-version }}`
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Ref: `${{ github.ref }}`
          - SHA: `${{ github.sha }}`

          ### Step outcomes
          | Step | Outcome |
          | --- | --- |
          | Setup .NET | ${{ steps.setup_dotnet.outcome }} |
          | dotnet --info | ${{ steps.dotnet_info.outcome }} |
          | Restore | ${{ steps.restore.outcome }} |
          | Build | ${{ steps.build.outcome }} |
          | Validate server.json | ${{ steps.validate_server_json.outcome }} |
          | Scenario + Release scenarios | ${{ steps.release_scenarios.outcome }} |
          '@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
